name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      - name: Verify dependency lock files are updated
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "${{ github.base_ref }}"
          # Two-dot diff: lists files changed in HEAD relative to base tip.
          # Does not require a merge base, so it works with shallow clones
          # where actions/checkout does not fetch common history.
          # Capture into a variable (not process substitution) so a
          # non-zero exit from git propagates via `set -e`.
          changed_files=$(git diff --name-only FETCH_HEAD..HEAD)
          requirements_changed=false
          requirements_lock_changed=false
          requirements_dev_changed=false
          requirements_dev_lock_changed=false
          while IFS= read -r file; do
            case "${file}" in
              requirements.txt) requirements_changed=true ;;
              requirements.lock) requirements_lock_changed=true ;;
              requirements-dev.txt) requirements_dev_changed=true ;;
              requirements-dev.lock) requirements_dev_lock_changed=true ;;
            esac
          done <<< "${changed_files}"
          if [[ "${requirements_changed}" == "true" && "${requirements_lock_changed}" != "true" ]]; then
            echo "::error::requirements.txt changed without updating requirements.lock"
            exit 1
          fi
          if [[ "${requirements_dev_changed}" == "true" && "${requirements_dev_lock_changed}" != "true" ]]; then
            echo "::error::requirements-dev.txt changed without updating requirements-dev.lock"
            exit 1
          fi
      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.lock
      - name: Format check
        run: black --check .
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
